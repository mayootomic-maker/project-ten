name: Project Ten | 50 research-trading pairs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/virtual-market-daily.yml'
  schedule:
    # Fast monitoring requested every five minutes. Best effort, NOT continuous hosting.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

concurrency:
  group: project-ten-virtual-ledger
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout persistent paper ledger
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify model invariants
        run: python -m unittest discover -s tests -q
      - name: Fetch public market data and run virtual agents
        run: |
          python -m project_ten.paired
          python scripts/verify_paired.py
      - name: Record trigger and observation health
        env:
          RUN_TRIGGER: ${{ github.event_name }}
        run: |
          python - <<'PYREPORT'
          import json, os
          from datetime import datetime, timezone
          report = json.load(open('docs/paired_dashboard.json'))
          observed = datetime.fromtimestamp(report['meta']['observed_at'], timezone.utc).isoformat()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Trigger: {os.environ['RUN_TRIGGER']}\n\nObservation UTC: {observed}\n\n")
              summary.write(f"Paper-only: {report['meta']['paper_only']}\n\nStats: {report['stats']}\n")
          PYREPORT
      - name: Publish ledger changes to repository
        shell: bash
        run: |
          git config user.name 'Project Ten Bot'
          git config user.email 'project-ten-bot@users.noreply.github.com'
          git add -A data state reports docs
          if ! git diff --cached --quiet; then
            git commit -m 'Update public-price paper ledger [skip ci]'
            git push
          else
            echo 'No state changes to commit'
          fi
      - name: Upload static dashboard for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  dashboard:
    needs: simulate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
